<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Memoriz - Questões e Repetição Espaçada</title>
    <meta name="description" content="Plataforma offline de fixação acelerada de conteúdo, filtros ultra-rápidos e banco de questões estruturado em JSON." />
    <meta property="og:title" content="Memoriz - Questões e Repetição Espaçada" />
    <meta property="og:description" content="Plataforma offline de fixação acelerada de conteúdo, filtros ultra-rápidos e banco de questões estruturado em JSON." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#100300" />
    
    <!-- Mobile & PWA optimization (iOS & Android) -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Memoriz" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

    <script>
      (function() {
        try {
          var p = null;
          try {
            p = localStorage.getItem('memoriz_prefs_v1') || localStorage.getItem('memoriz_prefs') || localStorage.getItem('memoriz_theme');
          } catch (storageErr) {}
          var t = 'night';
          if (p) {
            if (p.charCodeAt(0) === 123) { // starts with '{'
              try {
                var parsed = JSON.parse(p);
                if (parsed && parsed.theme) t = parsed.theme;
              } catch (jsonErr) {}
            } else {
              t = p;
            }
          }
          t = t === 'amber' ? 'night' : (t === 'sepia' ? 'reading' : t);
          var C = {
            light:   { b: '#f1f5f9', t: '#0f172a', a: '#2f7596', ac: '#ffffff' },
            dark:    { b: '#07090e', t: '#f8fafc', a: '#6366f1', ac: '#ffffff' },
            reading: { b: '#fbf5e8', t: '#2b1d0c', a: '#854d0e', ac: '#ffffff' },
            night:   { b: '#100300', t: '#ff7733', a: '#ff2b00', ac: '#100300' }
          };
          var c = C[t] || C.night;
          var s = document.documentElement.style;
          s.setProperty('--theme-app-bg', c.b);
          s.setProperty('--theme-text-primary', c.t);
          s.setProperty('--theme-accent', c.a);
          s.setProperty('--theme-accent-contrast', c.ac);
          document.documentElement.setAttribute('data-theme', t);
          if (t === 'dark') document.documentElement.classList.add('dark');
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', c.b);
        } catch (e) {}
      })();

      window.__signalReady = function(onComplete) {
        var preloader = document.getElementById('app-preloader');
        var status = document.getElementById('preloader-status-ready');
        if (!preloader) { if (onComplete) onComplete(); return; }

        if (status) {
          status.style.opacity = '1';
          status.style.transform = 'translateY(0)';
        }

        setTimeout(function() {
          preloader.classList.add('preloader-fade-out');
          setTimeout(function() {
            if (onComplete) onComplete();
          }, 200);
        }, 140);
      };
    </script>
    <style>
      #app-preloader.preloader-fade-out {
        opacity: 0 !important;
        transition: opacity 0.2s cubic-bezier(0.4, 0, 0.2, 1) !important;
        pointer-events: none !important;
      }

      html[data-theme="light"] { --theme-app-bg: #f1f5f9; --theme-text-primary: #0f172a; --theme-accent: #2f7596; --theme-accent-contrast: #ffffff; }
      html[data-theme="dark"] { --theme-app-bg: #07090e; --theme-text-primary: #f8fafc; --theme-accent: #6366f1; --theme-accent-contrast: #ffffff; }
      html[data-theme="reading"], html[data-theme="sepia"] { --theme-app-bg: #fbf5e8; --theme-text-primary: #2b1d0c; --theme-accent: #854d0e; --theme-accent-contrast: #ffffff; }
      html[data-theme="night"], html[data-theme="amber"] { --theme-app-bg: #100300; --theme-text-primary: #ff7733; --theme-accent: #ff2b00; --theme-accent-contrast: #100300; }

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        background-color: var(--theme-app-bg, #100300);
        color: var(--theme-text-primary, #ff7733);
        overflow-x: hidden;
      }
      html:has(#app-preloader),
      body:has(#app-preloader) {
        overflow: hidden !important;
        height: 100% !important;
      }
      #app-preloader,
      #app-preloader * {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
        transition: none !important;
      }
      html[data-theme="night"] #app-preloader img,
      html[data-theme="amber"] #app-preloader img,
      html[data-theme="night"] #app-preloader svg.emoji-filter,
      html[data-theme="amber"] #app-preloader svg.emoji-filter {
        filter: url(#circadian-zero-blue) !important;
        -webkit-filter: url(#circadian-zero-blue) !important;
      }

      /* Reforço de luminosidade do halo no modo Noturno (Zero Azul / Brilho Radiante) */
      html[data-theme="night"] .preloader-halo-layer,
      html[data-theme="amber"] .preloader-halo-layer {
        background: #ff2b00 !important;
        opacity: 0.55 !important;
        filter: blur(14px) drop-shadow(0 0 8px rgba(255, 43, 0, 0.6)) !important;
      }

      /* Reforço de contraste do halo no modo Sépia / Leitura (Canela Encorpado) */
      html[data-theme="reading"] .preloader-halo-layer,
      html[data-theme="sepia"] .preloader-halo-layer {
        background: #854d0e !important;
        opacity: 0.50 !important;
        filter: blur(12px) !important;
      }
    </style>
  </head>
  <body class="bg-canvas text-primary antialiased min-h-[100vh] min-h-[100dvh]">
    <!-- Hardware/SVG Circadian Zero-Blue Filter Definition (Monochromatic pure red luminance: R = 0.299R + 0.587G + 0.114B, G = 0, B = 0) -->
    <svg width="0" height="0" class="absolute w-0 h-0 overflow-hidden pointer-events-none" aria-hidden="true">
      <filter id="circadian-zero-blue" color-interpolation-filters="sRGB">
        <feColorMatrix type="matrix" values="
          0.299  0.587  0.114  0  0
          0.000  0.000  0.000  0  0
          0.000  0.000  0.000  0  0
          0.000  0.000  0.000  1  0" />
      </filter>
    </svg>

    <div id="root">
      <!-- Lightweight, zero-flash pre-mount loading shell consuming inline theme variables -->
      <div 
        id="app-preloader" 
        style="position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0; padding: 24px; box-sizing: border-box; text-align: center; background-color: var(--theme-app-bg); color: var(--theme-text-primary); z-index: 99999;"
      >

        <!-- Marca: ícone oficial com halo suave pulsante atrás -->
        <div style="position: relative; width: 48px; height: 48px; margin-bottom: 22px;">
          <div 
            class="preloader-halo-layer"
            style="position: absolute; inset: -10px; border-radius: 20px; background: var(--theme-accent); opacity: 0.35; filter: blur(14px); animation: preloader-halo 2.2s ease-in-out infinite; z-index: 1; transition: none !important;"
          ></div>
          <!-- Ícone 100% tonal e integrado às variáveis do tema ativo -->
          <svg 
            viewBox="0 0 512 512" 
            width="48" 
            height="48" 
            class="emoji-filter"
            style="width: 48px; height: 48px; display: block; position: relative; z-index: 2; border-radius: 14px; overflow: hidden; transition: none !important;"
            xmlns="http://www.w3.org/2000/svg"
          >
            <!-- Squircle Base: cor de destaque do tema -->
            <rect width="512" height="512" rx="112" fill="var(--theme-accent)" />
            
            <!-- Centelha / Estrela: contraste do tema (zero amarelo literal) -->
            <path 
              d="M 256 70 L 268 116 L 314 128 L 268 140 L 256 186 L 244 140 L 198 128 L 244 116 Z" 
              fill="var(--theme-accent-contrast, #ffffff)" 
              opacity="0.95"
            />
            
            <!-- Monogram M Oficial: contraste do tema -->
            <path 
              d="M 120 400 L 120 220 C 120 210 130 202 140 202 L 175 202 C 185 202 195 208 200 216 L 256 310 L 312 216 C 317 208 327 202 337 202 L 372 202 C 382 202 392 210 392 220 L 392 400 C 392 410 384 418 374 418 L 342 418 C 332 418 324 410 324 400 L 324 286 L 276 366 C 268 379 244 379 236 366 L 188 286 L 188 400 C 188 410 180 418 170 418 L 138 418 C 128 418 120 410 120 400 Z" 
              fill="var(--theme-accent-contrast, #ffffff)" 
            />
          </svg>
        </div>

        <!-- Onda de 3 blocos, ecoando o motivo das 3 lâmpadas da luminária -->
        <div style="display: flex; gap: 7px; margin-bottom: 18px;">
          <span class="preloader-dot" style="animation-delay: 0s;"></span>
          <span class="preloader-dot" style="animation-delay: 0.15s;"></span>
          <span class="preloader-dot" style="animation-delay: 0.3s;"></span>
        </div>

        <!-- Título principal com line-height e margem rígidos em pixels -->
        <div style="font-size: 13px; line-height: 18px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 4px 0; opacity: 0.85; display: block; text-align: center;">
          Preparando seu ambiente
        </div>

        <!-- Subtítulo com tamanho inteiro e altura de linha fixa -->
        <div style="font-size: 12px; line-height: 16px; opacity: 0.55; max-width: 240px; margin: 0 auto; display: block; text-align: center;">
          Carregando banco de questões e configurando sua sessão
        </div>

        <!-- Status de conclusão posicionado abaixo dos textos -->
        <div 
          id="preloader-status-ready"
          style="font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--theme-accent); opacity: 0; transform: translateY(2px); transition: opacity 0.15s ease, transform 0.15s ease; margin-top: 12px;"
        >
          Pronto
        </div>

        <style>
          .preloader-dot {
            width: 8px;
            height: 8px;
            border-radius: 3px;
            background: var(--theme-accent);
            display: inline-block;
            animation: preloader-wave 1.1s ease-in-out infinite;
          }
          @keyframes preloader-wave {
            0%, 100% { transform: scale(0.6); opacity: 0.3; }
            40% { transform: scale(1.15); opacity: 1; }
          }
          @keyframes preloader-halo {
            0%, 100% {
              opacity: 0.35;
              transform: scale(0.92);
            }
            50% {
              opacity: 0.75;
              transform: scale(1.16);
            }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Registro imediato do Service Worker para PWA (Android / iOS / Desktop)
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js', { scope: '/' })
            .then((registration) => {
              console.log('[PWA] Service Worker registrado com sucesso:', registration.scope);
            })
            .catch((error) => {
              console.warn('[PWA] Falha ao registrar Service Worker:', error);
            });
        });
      }
    </script>
  </body>
</html>

<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Memoriz - Questões e Repetição Espaçada</title>
    <meta name="description" content="Plataforma offline de fixação acelerada de conteúdo, filtros ultra-rápidos e banco de questões estruturado em JSON." />
    <meta property="og:title" content="Memoriz - Questões e Repetição Espaçada" />
    <meta property="og:description" content="Plataforma offline de fixação acelerada de conteúdo, filtros ultra-rápidos e banco de questões estruturado em JSON." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#100300" />
    
    <!-- Mobile & PWA optimization (iOS & Android) -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Memoriz" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

    <script>
      // Immediate theme & topbar color initialization to prevent color mismatch on cold load or cache purge
      (function() {
        try {
          var theme = 'night';
          var prefsRaw = localStorage.getItem('memoriz_prefs');
          if (prefsRaw) {
            try {
              var parsed = JSON.parse(prefsRaw);
              if (parsed && parsed.theme) theme = parsed.theme;
            } catch (err) {}
          } else {
            var saved = localStorage.getItem('memoriz_theme');
            if (saved) theme = saved;
          }
          if (theme === 'amber') theme = 'night';
          if (theme === 'sepia') theme = 'reading';

          var TOPBAR_COLORS = {
            night: '#100300',
            dark: '#0d131f',
            reading: '#f5ece0',
            light: '#ffffff'
          };
          var topColor = TOPBAR_COLORS[theme] || '#100300';

          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.className = theme === 'night' ? 'theme-amber' : ('theme-' + theme);
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }

          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute('content', topColor);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-canvas text-primary antialiased min-h-[100vh] min-h-[100dvh]">
    <!-- Hardware/SVG Circadian Zero-Blue Filter Definition (Monochromatic pure red luminance: R = 0.299R + 0.587G + 0.114B, G = 0, B = 0) -->
    <svg width="0" height="0" class="absolute w-0 h-0 overflow-hidden pointer-events-none" aria-hidden="true">
      <filter id="circadian-zero-blue" color-interpolation-filters="sRGB">
        <feColorMatrix type="matrix" values="
          0.299  0.587  0.114  0  0
          0.000  0.000  0.000  0  0
          0.000  0.000  0.000  0  0
          0.000  0.000  0.000  1  0" />
      </filter>
    </svg>

    <div id="root">
      <!-- Lightweight, zero-flash pre-mount loading shell -->
      <div id="app-preloader" style="min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center;">

        <!-- Marca: quadrado com "M", com halo suave pulsante atrás -->
        <div style="position: relative; width: 48px; height: 48px; margin-bottom: 22px;">
          <div style="position: absolute; inset: -14px; border-radius: 50%; background: var(--theme-accent, currentColor); opacity: 0.18; filter: blur(14px); animation: preloader-halo 2.4s ease-in-out infinite;"></div>
          <div style="position: relative; width: 100%; height: 100%; border-radius: 14px; background: var(--theme-accent, currentColor); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 18px rgba(0,0,0,0.18);">
            <span style="font-family: inherit; font-weight: 800; font-size: 22px; color: var(--theme-accent-contrast, currentColor);">M</span>
          </div>
        </div>

        <!-- Onda de 3 blocos, ecoando o motivo das 3 lâmpadas da luminária -->
        <div style="display: flex; gap: 7px; margin-bottom: 18px;">
          <span class="preloader-dot" style="animation-delay: 0s;"></span>
          <span class="preloader-dot" style="animation-delay: 0.15s;"></span>
          <span class="preloader-dot" style="animation-delay: 0.3s;"></span>
        </div>

        <div style="font-size: 13px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 6px; opacity: 0.85;">Preparando seu ambiente</div>
        <div style="font-size: 11.5px; opacity: 0.55; max-width: 240px; line-height: 1.4;">Carregando banco de questões e configurando sua sessão</div>

        <!-- Barra fininha com brilho deslizante, no lugar de spinner/percentual -->
        <div style="position: relative; width: 130px; height: 3px; border-radius: 999px; background: currentColor; opacity: 0.12; margin-top: 20px; overflow: hidden;">
          <div style="position: absolute; inset: 0; border-radius: 999px; background: linear-gradient(90deg, transparent, var(--theme-accent, currentColor), transparent); animation: preloader-shimmer 1.5s ease-in-out infinite;"></div>
        </div>

        <style>
          .preloader-dot {
            width: 8px;
            height: 8px;
            border-radius: 3px;
            background: var(--theme-accent, currentColor);
            display: inline-block;
            animation: preloader-wave 1.1s ease-in-out infinite;
          }
          @keyframes preloader-wave {
            0%, 100% { transform: scale(0.6); opacity: 0.3; }
            40% { transform: scale(1.15); opacity: 1; }
          }
          @keyframes preloader-halo {
            0%, 100% { opacity: 0.1; transform: scale(0.9); }
            50% { opacity: 0.28; transform: scale(1.15); }
          }
          @keyframes preloader-shimmer {
            0% { transform: translateX(-130px); }
            100% { transform: translateX(130px); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Registro imediato do Service Worker para PWA (Android / iOS / Desktop)
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js', { scope: '/' })
            .then((registration) => {
              console.log('[PWA] Service Worker registrado com sucesso:', registration.scope);
            })
            .catch((error) => {
              console.warn('[PWA] Falha ao registrar Service Worker:', error);
            });
        });
      }
    </script>
  </body>
</html>
